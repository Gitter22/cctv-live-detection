name: ${COMPOSE_PROJECT_NAME:-cctv}

# Two profiles (set COMPOSE_PROFILES in .env):
#   server  Postgres + API (+ web app later): the hub that manages all organizations and sites
#   edge    go2rtc + MQTT + edge agent + vision: runs AT a site, next to its NVR/cameras
# This laptop runs both (COMPOSE_PROFILES=server,edge). A remote site runs only "edge" with
# EDGE_SERVER_URL pointing at the hub.

services:
  # The ONLY component that talks to the NVR. Everything else reads from here.
  go2rtc:
    profiles: [edge]
    image: alexxit/go2rtc:1.9.15
    restart: unless-stopped
    volumes:
      # go2rtc.yaml is generated by the edge agent from the server config.
      - edge-gen:/config
    ports:
      - '${GO2RTC_API_PORT:-1984}:1984' # web UI + API (live view)
      - '${GO2RTC_RTSP_PORT:-8554}:8554' # RTSP restream
      - '${GO2RTC_WEBRTC_PORT:-8555}:8555/tcp' # WebRTC
      - '${GO2RTC_WEBRTC_PORT:-8555}:8555/udp'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:1984/api']
      interval: 10s
      timeout: 3s
      retries: 10

  mosquitto:
    profiles: [edge]
    image: eclipse-mosquitto:2.0.23
    restart: unless-stopped
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - '${MQTT_PORT:-1883}:1883'
    healthcheck:
      test: ['CMD', 'mosquitto_sub', '-t', '$$SYS/broker/uptime', '-C', '1', '-W', '3']
      interval: 10s
      timeout: 5s
      retries: 10

  # Owned by apps/server (Prisma) from step 2. The vision service never touches it.
  postgres:
    profiles: [server]
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    profiles: [server]
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SERVER_PORT: 4000
      LOG_LEVEL: ${SERVER_LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      SECRETS_KEY: ${SECRETS_KEY}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:5173}
      SNAPSHOT_STORE: /data/store
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Platform Admin}
    ports:
      - '${SERVER_PORT:-4000}:4000'
    volumes:
      - server-store:/data/store
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/health']
      interval: 10s
      timeout: 3s
      retries: 10

  # Web app (React SPA via nginx, same-origin proxy to the API).
  web:
    profiles: [server]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-5173}:80'
    depends_on:
      server:
        condition: service_healthy

  # Edge agent: syncs this site's config from the server, drives go2rtc + vision.
  edge:
    profiles: [edge]
    build:
      context: .
      dockerfile: docker/edge.Dockerfile
    restart: unless-stopped
    environment:
      SERVER_URL: ${EDGE_SERVER_URL:-http://server:4000}
      EDGE_SITE_ID: ${EDGE_SITE_ID}
      EDGE_TOKEN: ${EDGE_TOKEN}
      GO2RTC_API: http://go2rtc:1984
      GO2RTC_RTSP: rtsp://go2rtc:8554
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-cctv/v1}
      # Where browsers reach this site's go2rtc player (LAN live view)
      EDGE_LIVE_URL: ${EDGE_LIVE_URL:-http://localhost:1984}
      # Where viewers reach go2rtc's WebRTC port (this machine's browser: 127.0.0.1)
      EDGE_WEBRTC_CANDIDATES: ${EDGE_WEBRTC_CANDIDATES:-127.0.0.1:8555,stun:8555}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - edge-gen:/gen
      - edge-state:/state
      - snapshots:/data/snapshots:ro
    depends_on:
      mosquitto:
        condition: service_healthy

  vision:
    profiles: [edge]
    build:
      context: .
      dockerfile: docker/vision.Dockerfile
      # Optional: reuse the host's uv download cache (set UV_CACHE_HOST_DIR in .env).
      additional_contexts:
        uvcache: ${UV_CACHE_HOST_DIR:-docker/empty-cache}
      args:
        DFINE_VARIANT: ${DFINE_VARIANT:-s}
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-cctv/v1}
      GO2RTC_RTSP: rtsp://go2rtc:8554
      # Generated by the edge agent; hot-reloaded on change.
      VISION_CONFIG: /gen/vision.yaml
      GO2RTC_API: http://go2rtc:1984
      VISION_THREADS: ${VISION_THREADS:-4}
      SNAPSHOT_DIR: /data/snapshots
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - edge-gen:/gen:ro
      - snapshots:/data/snapshots
    depends_on:
      go2rtc:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

volumes:
  # Vision writes event snapshots here; the edge reads and uploads them. A named volume
  # (not a host folder): host bind mounts can go stale after Docker Desktop restarts on WSL.
  snapshots:
  edge-gen:
  edge-state:
  pgdata:
  server-store:
  mosquitto-data:
