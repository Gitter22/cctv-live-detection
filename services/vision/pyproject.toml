[project]
name = "cctv-vision"
version = "0.1.0"
description = "Detection core: RTSP -> detect -> track -> zones -> generic events on MQTT. No business rules, no database."
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=19.0.2",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "opencv-python-headless>=5.1.0.95",
    "paho-mqtt>=2.2.0",
    "pyyaml>=6.0.4",
]

[tool.uv]
package = false
